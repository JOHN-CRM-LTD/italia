<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Italia demo is coming soon. Explore JOHN CRM while we prepare the experience.">
  <meta name="robots" content="noindex, follow">
  <meta name="color-scheme" content="light">
  <title>Italia demo — coming soon | JOHN CRM</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #292823; background: #f7f5f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header, main, footer { width: min(100% - 3rem, 68rem); margin-inline: auto; }
    header { padding-block: 2rem; border-bottom: 1px solid #dcd8ce; }
    .brand { color: inherit; text-decoration: none; font-size: 1.05rem; font-weight: 750; letter-spacing: .12em; }
    .brand span { font-weight: 450; letter-spacing: .04em; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-block: 5rem; }
    .eyebrow { margin: 0 0 1.5rem; color: #6b4138; font-size: .8rem; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 12ch; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3.25rem, 8vw, 6rem); font-weight: 400; line-height: 1.04; letter-spacing: -.045em; }
    h1 span { display: block; color: #7a4438; }
    .description { max-width: 35rem; margin: 1.75rem 0 2.25rem; color: #656158; font-size: 1.1rem; line-height: 1.7; }
    .cta { display: inline-flex; align-items: center; gap: 1.5rem; padding: 1rem 1.35rem; border-radius: .35rem; color: #fff; background: #64382f; text-decoration: none; font-size: .95rem; font-weight: 600; }
    .cta:hover { background: #492820; }
    a:focus-visible { outline: 3px solid #9b6249; outline-offset: 5px; }
    footer { padding-block: 1.5rem; border-top: 1px solid #dcd8ce; color: #726e64; font-size: .8rem; line-height: 1.6; }
    @media (max-width: 480px) { header, main, footer { width: calc(100% - 2.5rem); } header { padding-block: 1.5rem; } main { padding-block: 3.5rem; } }
  </style>
</head>
<body>
  <header><a class="brand" href="https://www.johncrm.com/" aria-label="JOHN CRM home">JOHN <span>CRM</span></a></header>
  <main>
    <p class="eyebrow">Italia demo</p>
    <h1>Something new.<span>Coming soon.</span></h1>
    <p class="description">We’re preparing the Italia demo. In the meantime, discover how JOHN CRM helps businesses take care of their customers.</p>
    <a class="cta" href="https://www.johncrm.com/">Explore JOHN CRM <span aria-hidden="true">↗</span></a>
  </main>
  <footer>Italia demo · Powered by JOHN CRM</footer>
</body>
</html>
